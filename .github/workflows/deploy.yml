name: Publish website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [BIVL100_V4_WEBSITE_SMALL.zip, .github/workflows/deploy.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Assemble V4 website with unchanged existing images
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/SAHARIARSHOWMIK/bivl100/${{ github.sha }}/BIVL100_V4_WEBSITE_SMALL.zip" \
            -o website.zip
          echo "9d5f9a184c79e07764f22c024aab1fb02707ab9f8ba7c86f54c426b551274342  website.zip" | sha256sum --check -
          unzip -tq website.zip
          mkdir site
          unzip -q website.zip -d site
          curl --fail --location --retry 3 \
            https://github.com/SAHARIARSHOWMIK/bivl100/releases/download/site/website.zip \
            -o original-media.zip
          echo "d475c03b15fddf00577ef4469ed6411ca94f333fe47f4ed0143b973588e56642  original-media.zip" | sha256sum --check -
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          site = Path('site').resolve()
          # Restore byte-identical original images from the existing release.
          families = [json.loads(line) for line in (site/'data/families.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          with zipfile.ZipFile('original-media.zip') as archive:
              for family in families:
                  for image in family['image_variants']:
                      target = (site/image['path']).resolve()
                      assert target.is_relative_to(site), image['path']
                      members = [name for name in archive.namelist() if name.startswith('media/' + image['asset_id'] + '.') and not name.endswith('/')]
                      assert len(members) == 1, image['asset_id']
                      member = members[0]
                      data = archive.read(member)
                      assert hashlib.sha256(data).hexdigest() == image['sha256'], member
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
          checks = json.loads((site/'data/content_sha256.json').read_text(encoding='utf-8'))
          for name, expected in checks.items():
              path = (site/name).resolve()
              assert path.is_relative_to(site), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          def rows(name):
              return [json.loads(line) for line in (site/'data'/name).read_text(encoding='utf-8').splitlines() if line.strip()]
          families = rows('families.jsonl')
          scripts = rows('compiled_user_scripts.jsonl')
          specs = rows('independent_run_specs.jsonl')
          reviews = rows('case_quality_review.jsonl')
          assert len(families) == len(reviews) == 100
          assert len(scripts) == 450 and all(len(s['turns']) == 100 for s in scripts)
          assert len(specs) == 2250
          assert {s['condition'] for s in scripts} == {'neutral','visually_consistent','misleading'}
          assert {s['checkpoint'] for s in specs} == {0,8,24,50,100}
          assert len({v['path'] for f in families for v in f['image_variants']}) == 150
          assert json.loads((site/'data/manifest.json').read_text(encoding='utf-8'))['dataset_version'] == 'bivl100-rq-v4'
          assert all((site/name).is_file() for name in ['index.html','app.js','style.css','404.html'])
          print('Verified V4: 100 cases, 150 images, 450 full user scripts, 2250 checkpoint plans.')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
